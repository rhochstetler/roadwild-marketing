# roadwild.org — the marketing site. The app is a separate host, app.roadwild.org.
#
# THE BUILD IS CONFIGURED HERE, NOT IN THE NETLIFY UI. A setting that exists in
# both places is a setting that will disagree with itself, and the UI copy is
# the one nobody can read in a diff.

[build]
  # Not a bundler. This fetches the app's deployed CSS and regenerates
  # site/assets/brand.css from it; if the two brands have drifted, it exits
  # non-zero and this deploy does not happen. See scripts/sync-brand.mjs.
  command = "node scripts/sync-brand.mjs"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# SHARE LINKS — LOAD-BEARING. READ BEFORE TOUCHING.
# ---------------------------------------------------------------------------
# createShareLink in the app mints links of the form
#   https://roadwild.org/functions/sharedPlace?t=TOKEN
# Those tokens NEVER EXPIRE, some were texted to people who have no account and
# no other way back in, and they CANNOT BE REISSUED -- there is no record of who
# holds one. Deleting this rule breaks them permanently.
#
# 301, not 302: these are permanent now that the app has moved, and the query
# string carries through automatically.
[[redirects]]
  from = "/functions/*"
  to = "https://app.roadwild.org/functions/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# APP ROUTES
# ---------------------------------------------------------------------------
# ENUMERATED ON PURPOSE. A catch-all /* would forward this site's own pages to
# the app -- every marketing page added from here on would silently vanish the
# day it shipped. When a route is added to src/App.jsx, add it here too.
#
# NOT LISTED, DELIBERATELY:
#   /privacy, /terms — this site serves its OWN copies. The app also has them
#   (it must, for the sign-up flow and the app stores), but the public,
#   indexable ones are here.

