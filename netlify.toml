# ---------------------------------------------------------------------------
# HEADERS
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No geolocation, camera or microphone: this site is text. The app asks for
    # location; this page has no business doing so.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    # NO 'unsafe-inline' FOR SCRIPTS. It is not needed -- the one script on this
    # site is site/assets/site.js -- and leaving it out is what makes this header
    # worth having. connect-src names the app explicitly because that is where
    # the waitlist form posts; nothing else may be contacted from this page.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://app.roadwild.org"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # brand.css is regenerated on every deploy and is NOT content-hashed, so it
    # must not be cached hard -- a stale copy is a site whose colours are a
    # deploy behind the app, which is the drift this repo exists to prevent.
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/photos/*"
  [headers.values]
    # Amanda and Robyn's photographs on /about. These are NOT under /assets/ on
    # purpose: that path is capped at ten minutes because brand.css is
    # regenerated on every deploy and is not content-hashed, and re-fetching
    # 3.7MB of photographs every ten minutes to protect a stylesheet would be
    # absurd. A photo here is immutable -- change the picture, change the
    # filename -- so it can be cached hard.
    Cache-Control = "public, max-age=31536000, immutable"
